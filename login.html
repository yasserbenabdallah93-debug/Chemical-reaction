<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121b22;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 20px 24px;
        }

        .top-bar {
            width: 100%;
            text-align: center;
            color: #8696a0;
            font-size: 13px;
            margin-top: 10px;
        }

        .main-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 40px;
        }

        form {
            width: 100%;
        }

        .input-field {
            width: 100%;
            background-color: #1f2c34;
            border: 1px solid #2a3942;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .input-field::placeholder {
            color: #8696a0;
        }

        .input-field:focus {
            border-color: #0064e0;
        }

        .btn-login {
            width: 100%;
            background-color: #0064e0;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 6px;
            cursor: pointer;
        }

        .forgot-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            display: inline-block;
        }

        .bottom-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-create {
            width: 100%;
            background-color: transparent;
            color: #42b72a;
            border: 1px solid #2a3942;
            border-radius: 25px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            margin-bottom: 24px;
            color: #0064e0;
        }

        .meta-logo {
            height: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        Français (France)
    </div>

    <div class="main-container">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <radialGradient id="rg" cx="0.2" cy="1" r="1">
                <stop offset="0%" stop-color="#fdf497"/>
                <stop offset="5%" stop-color="#fdf497"/>
                <stop offset="45%" stop-color="#fd5949"/>
                <stop offset="60%" stop-color="#d6249f"/>
                <stop offset="90%" stop-color="#285AEB"/>
            </radialGradient>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#rg)"/>
            <rect x="5" y="5" width="14" height="14" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
            <circle cx="15.5" cy="8.5" r="1" fill="#ffffff"/>
        </svg>

        <form action="#">
            <input type="text" class="input-field" placeholder="Nom de profil, e-mail ou numéro de mobile" required>
            <input type="password" class="input-field" placeholder="Mot de passe" required>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
    </div>

    <div class="bottom-container">
        <a href="#" class="btn-create">Créer un nouveau compte</a>
